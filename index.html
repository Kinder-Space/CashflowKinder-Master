<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Proyek UMKM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/json,{%22name%22:%22KeuanganProyek%22,%22short_name%22:%22Keuangan%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22}">
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">📊 FinanceApp Proyek</h1>
        <span class="text-xs bg-blue-700 px-2 py-1 rounded">PWA Active</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Form Select Proyek -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <label class="block text-sm font-semibold mb-1">Pilih Proyek Aktif:</label>
            <select id="projectSelect" onchange="renderDashboard()" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500">
                <option value="Proyek A - Renovasi">Proyek A - Renovasi</option>
                <option value="Proyek B - Website">Proyek B - Website</option>
                <option value="Proyek C - Catering">Proyek C - Catering</option>
            </select>
        </section>

        <!-- Summary Cards -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                <p class="text-xs text-emerald-700 font-medium">Pemasukan</p>
                <p id="totalIncome" class="text-lg font-bold text-emerald-800">Rp 0</p>
            </div>
            <div class="bg-rose-50 p-3 rounded-xl border border-rose-200">
                <p class="text-xs text-rose-700 font-medium">Pengeluaran</p>
                <p id="totalExpense" class="text-lg font-bold text-rose-800">Rp 0</p>
            </div>
            <div class="col-span-2 bg-blue-50 p-3 rounded-xl border border-blue-200 text-center">
                <p class="text-xs text-blue-700 font-medium">Sisa Kas Proyek</p>
                <p id="netBalance" class="text-xl font-black text-blue-900">Rp 0</p>
            </div>
        </section>

        <!-- Upload & OCR Form -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <h2 class="font-bold text-md text-gray-700 border-b pb-2"> Upload Screenshot Bukti Transfer</h2>
            
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih File / Tangkapan Layar:</label>
                <input type="file" id="screenshotInput" accept="image/*" onchange="processScreenshot(event)" class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div id="ocrStatus" class="hidden text-xs text-blue-600 font-medium animate-pulse">
                ⏳ Membaca screenshot & ekstrak data AI...
            </div>

            <!-- Form Hasil Parsing AI -->
            <form id="txForm" onsubmit="saveTransaction(event)" class="space-y-3 pt-2">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500">Jenis Transaksi</label>
                        <select id="txType" class="w-full p-2 text-xs border rounded-lg bg-gray-50">
                            <option value="Pengeluaran">Pengeluaran</option>
                            <option value="Pemasukan">Pemasukan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">Tanggal</label>
                        <input type="date" id="txDate" required class="w-full p-2 text-xs border rounded-lg bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-500">Nominal (Rp)</label>
                    <input type="number" id="txAmount" placeholder="Contoh: 1500000" required class="w-full p-2 text-xs border rounded-lg bg-gray-50 font-bold text-gray-800">
                </div>

                <div>
                    <label class="block text-xs text-gray-500">Kategori & Keterangan</label>
                    <input type="text" id="txDesc" placeholder="Misal: Pembelian Semen / DP Klien" required class="w-full p-2 text-xs border rounded-lg bg-gray-50">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">
                    💾 Simpan ke Sheets & Drive
                </button>
            </form>
        </section>

        <!-- Riwayat Transaksi -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="font-bold text-md text-gray-700 mb-3">Riwayat Transaksi</h2>
            <div id="txList" class="space-y-2 max-h-60 overflow-y-auto text-xs">
                <!-- Item transaksi dimasukkan via Javascript -->
            </div>
        </section>

    </main>

    <script>
        // Web Apps Script URL milik Anda untuk dikoneksikan ke Google Sheets & Drive
        const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

        // Inisialisasi Data awal
        let transactions = JSON.parse(localStorage.getItem('my_financial_data')) || [
            { id: 1, project: "Proyek A - Renovasi", type: "Pemasukan", amount: 5000000, date: "2026-10-08", desc: "DP Klien Termyn 1", driveLink: "#" },
            { id: 2, project: "Proyek A - Renovasi", type: "Pengeluaran", amount: 1500000, date: "2026-10-09", desc: "Beli Bahan Semen & Cat", driveLink: "#" }
        ];

        // Format angka ke Rupiah
        const formatRupiah = (val) => "Rp " + new Intl.NumberFormat('id-ID').format(val);

        // Render data dashboard sesuai proyek aktif
        function renderDashboard() {
            const currentProject = document.getElementById('projectSelect').value;
            const filtered = transactions.filter(t => t.project === currentProject);

            let income = 0, expense = 0;
            const txListEl = document.getElementById('txList');
            txListEl.innerHTML = '';

            filtered.forEach(t => {
                if(t.type === 'Pemasukan') income += t.amount;
                else expense += t.amount;

                txListEl.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                        <div>
                            <p class="font-semibold text-gray-800">${t.desc}</p>
                            <p class="text-gray-400 text-[10px]">${t.date} • <a href="${t.driveLink}" target="_blank" class="text-blue-500 underline">Bukti Drive</a></p>
                        </div>
                        <span class="font-bold ${t.type === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">
                            ${t.type === 'Pemasukan' ? '+' : '-'} ${formatRupiah(t.amount)}
                        </span>
                    </div>
                `;
            });

            document.getElementById('totalIncome').innerText = formatRupiah(income);
            document.getElementById('totalExpense').innerText = formatRupiah(expense);
            document.getElementById('netBalance').innerText = formatRupiah(income - expense);
        }

        // Simulasi ekstraksi AI dari Screenshot
        function processScreenshot(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('ocrStatus').classList.remove('hidden');

            // Mengisi form otomatis berdasarkan OCR (Simulasi)
            setTimeout(() => {
                document.getElementById('ocrStatus').classList.add('hidden');
                document.getElementById('txType').value = "Pengeluaran";
                document.getElementById('txAmount').value = Math.floor(Math.random() * 500000) + 50000;
                document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('txDesc').value = "Hasil OCR: " + file.name.replace(/\.[^/.]+$/, "");
            }, 1200);
        }

        // Simpan Transaksi Baru
        function saveTransaction(e) {
            e.preventDefault();

            const newTx = {
                id: Date.now(),
                project: document.getElementById('projectSelect').value,
                type: document.getElementById('txType').value,
                amount: Number(document.getElementById('txAmount').value),
                date: document.getElementById('txDate').value,
                desc: document.getElementById('txDesc').value,
                driveLink: "https://drive.google.com" // Placeholder link Drive
            };

            transactions.unshift(newTx);
            localStorage.setItem('my_financial_data', JSON.stringify(transactions));
            
            // Kirim data ke Google Sheets melalui Apps Script API
            if(GOOGLE_SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(newTx)
                });
            }

            document.getElementById('txForm').reset();
            renderDashboard();
            alert("Transaksi berhasil disimpan dan diarsipkan!");
        }

        // Inisialisasi awal saat aplikasi dibuka
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        renderDashboard();
    </script>
</body>
</html>
